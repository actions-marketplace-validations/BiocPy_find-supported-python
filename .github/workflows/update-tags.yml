name: Update tags

on:
  workflow_run:
    workflows: [Continuous integration]
    types: [completed]
    branches: [main]

jobs:
  update-tags:
    name: Update tags
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Determine package version
      id: find-version
      run: |
        version=$(cat package.json | jq --raw-output ".version") 
        echo ${version}
        echo "version=v${version}" >> ${GITHUB_OUTPUT}

    - name: Update tags 
      uses: actions/github-script@v9
      env:
        PACKAGE_VERSION: ${{ steps.find-version.outputs.version }}
      with:
        script: | 
          const version = process.env.PACKAGE_VERSION;
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA
          const i = repository.indexOf("/")
          const owner = repository.slice(0, i)
          const repo = repository.slice(i + 1)

          try {
            await octokit.rest.git.getRef({ owner, repo, ref: `tags/${version}` });
            return false;
          } catch (e) {
            await octokit.rest.git.createRef({ owner, repo, ref: `refs/tags/${version}`, sha });
          }

          const middle = version.replace(/\.[0-9]+$/, "");
          try {
            await octokit.rest.git.updateRef({ owner, repo, ref: `tags/${middle}`, sha });
          } catch (e) {
            await octokit.rest.git.createRef({ owner, repo, ref: `refs/tags/${middle}`, sha });
          }

          const short = version.replace(/\..*/, "");
          try {
            await octokit.rest.git.updateRef({ owner, repo, ref: `tags/${short}`, sha });
          } catch (e) {
            await octokit.rest.git.createRef({ owner, repo, ref: `refs/tags/${short}`, sha });
          }
